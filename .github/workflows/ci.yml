name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run compile
      - name: Build Chrome
        run: npm run build
      - name: Build Firefox
        run: npm run build:firefox
      - name: Install test browsers
        run: npx playwright install --with-deps chromium firefox
      - name: Test light and dark themes
        run: npm test

  publish-firefox:
    needs: lint
    if: >-
      github.repository == 'andyklimczak/better-vveather' &&
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: firefox-amo-publish
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Assign unique release version
        # Retries get a new version too; AMO does not accept duplicate versions.
        run: npm version "0.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" --no-git-tag-version
      - name: Package Firefox extension and review sources
        run: npm run zip:firefox
      - name: Verify Mozilla API credentials
        env:
          FIREFOX_EXTENSION_ID: '{4402e563-bfc0-4d5e-b4db-51c65836e661}'
          JWT_ISSUER: ${{ secrets.JWT_ISSUER }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: node scripts/select-firefox-credentials.mjs
      - name: Submit listed update to Firefox Add-ons
        env:
          FIREFOX_EXTENSION_ID: '{4402e563-bfc0-4d5e-b4db-51c65836e661}'
          JWT_ISSUER: ${{ secrets.JWT_ISSUER }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          npx wxt submit \
            --firefox-jwt-issuer "$JWT_ISSUER" \
            --firefox-jwt-secret "$JWT_SECRET" \
            --firefox-channel listed \
            --firefox-zip .output/*-firefox.zip \
            --firefox-sources-zip .output/*-sources.zip
          node scripts/verify-firefox.mjs
